scheduler: 172.31.8.202

user-request-port: 8080
workflow-complete-port: 8082
resource-request-port: 8084
executor-incoming-port: 8089

fsx-cost: 8.38e-05

# Slurm cluster (ParallelCluster) — 4x g4dn.xlarge
on-prem:
  - name: on-prem
    ip: [172.31.6.114] # Slurm head node IP (executor)
    slots: 4 # 4 compute nodes
    cores: 4 # g4dn.xlarge vCPUs
    runtime: 540
    reserved-cost: 0.526 # g4dn.xlarge on-demand $/hour

cloud:
  - name: g4dn.xlarge
    ip: []
    cores: 4
    runtime: 540
    reserved-slots: 0
    on-demand-slots: 0
    on-demand-cost: 0.526
    reserved-cost: 0.227

  - name: g5.xlarge
    ip: []
    cores: 4
    runtime: 265
    reserved-slots: 0
    on-demand-slots: 0
    on-demand-cost: 1.006
    reserved-cost: 0.435