version: 1

# Global pools tracked by the scheduler
# Sized to 1.15x the BASELINE STATIC (EDF-ST-LA) peak token demand at N=400, measured
# buffer-free across 6 seeds (max-seed peak: ANSYS=5071, ABAQUS=1376, LSDYNA=5408).
# => static sits at ~87% peak occupancy (high, non-blocking scarcity). Policy-independent
# reference (static never buffers), replacing the earlier elastic-inflated peak.
pools:
  ANSYS:
    total_tokens: 5832         # 1.15 x 5071 static peak (was 6700; elastic-inflated)
    reserved_floor: 0          # optionally keep some tokens unallocatable
    burst_cap: null            # optional short-term cap > total_tokens for grace windows
  ABAQUS:
    total_tokens: 1582         # 1.15 x 1376 static peak (was 2200)
    reserved_floor: 0
    burst_cap: null
  LSDYNA:
    total_tokens: 6219         # 1.15 x 5408 static peak (was 7600)
    reserved_floor: 0
    burst_cap: null

# Accounting policy for how tokens are consumed
policy:
  mode: per_core           # per_chain | per_core | custom
  tokens_per_chain: 1        # used when mode == per_chain
  tokens_per_core: null      # used when mode == per_core (e.g., 0.25)
  rounding: ceil             # ceil | floor | nearest (when per_core is used)
  two_phase_commit: true     # hold() then commit() to avoid races
  lifo_release: true         # release newest allocations first within a pool

  per_core:
  # default if software not matched
    default_strategy: linear 

    strategies:
      lsdyna:
        type: linear

      abaqus: 
        type: powerlaw
        a: 5.0
        b: 0.422
        min_tokens: 5

      ansys:
        type: ansys_workgroup 

# Optional fairness/anti-starvation knobs for admission/backfill
fairness:
  max_consecutive_starts_per_pool: 3
  rebalance_weight: 0.25     # 0..1; higher = stronger push toward underused pools

# Optional mapping conveniences / normalization
aliases:
  ansys: ANSYS
  abaqus: ABAQUS
  lsdyna: LSDYNA

# Validation rules and guardrails
guards:
  enforce_known_pools: true  # reject unknown license names
  deny_if_tokens_exact_zero: true
  warn_below_reserved_floor: true

