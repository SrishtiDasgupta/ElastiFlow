api: 4.7.0
id: hpo-sim-wf1-vgg19-small
constraints:
  budget: 15.0
  deadline: 800.0
  chains: 4
  tinydaIterations: 4
config:
  mesh: vgg19
  workflowIterations: 3
vars:
- id: input_config
  value:
    learning_rate: 0.01
    momentum: 0.9
    batch_size: 64
    epochs: 4
    next_trials: 4
    model: vgg19
actions:
- type: for
  input: input_config
  enumerator: i
  yieldToInput: output_config
  actions:
  - type: execute
    service: /fsx/Vortex-mid/Vortex-moldable-sched/service/run_hpo.py
    inputs:
    - id: config
      var: i
    outputs:
    - id: config_out
      var: output_config
