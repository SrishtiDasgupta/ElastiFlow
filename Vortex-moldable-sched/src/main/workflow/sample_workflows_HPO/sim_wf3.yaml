api: 4.7.0
id: hpo-sim-wf3-resnet-tight-deadline

constraints:
  budget: 50.00
  deadline: 2400                # Tight deadline
  chains: 6                     # Many trials
  tinydaIterations: 6

config:
  mesh: wide_resnet101_2        # Heaviest model
  workflowIterations: 2         # Fewer rounds due to tight deadline

vars:
  - id: input_config
    value: {
      "learning_rate": 0.005,
      "momentum": 0.9,
      "batch_size": 64,
      "epochs": 6,
      "next_trials": 6,
      "model": "wide_resnet101_2"
    }

actions:
  - type: for
    input: input_config
    enumerator: i
    yieldToInput: output_config
    actions:
      - type: execute
        service: /fsx/Vortex-mid/Vortex-moldable-sched/service/run_hpo.py
        inputs:
          - id: config
            var: i
        outputs:
          - id: config_out
            var: output_config
