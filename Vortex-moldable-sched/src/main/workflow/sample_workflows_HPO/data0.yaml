api: 4.7.0
id: test-hpo-dedicated-executor-001

constraints:
  budget: 25.50
  deadline: 7200
  chains: 2                     # Number of trials/samples
  tinydaIterations: 6           # Number of epochs per trial

config:
  mesh: vgg19                   # Model: vgg19/convnext_large/wide_resnet101_2
  workflowIterations: 4         # Max HPO optimization rounds

vars:
  - id: input_config
    value: {
      "learning_rate": 0.01,
      "momentum": 0.9,
      "batch_size": 64,
      "epochs": 6,
      "next_trials": 3,
      "model_name": "vgg19"
    }

actions:
  - type: for
    input: input_config
    enumerator: i
    yieldToInput: output_config
    actions:
      - type: execute
        service: /fsx/Vortex/service/run_hpo.py
        inputs:
          - id: config
            var: i
        outputs:
          - id: config_out
            var: output_config
