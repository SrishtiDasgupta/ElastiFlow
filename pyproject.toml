[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastiflow"
version = "0.1.0"
readme = "README.md"
description = "ElastiFlow: a runtime framework for elastic resource management of iterative scientific workflows, with a discrete-event simulation backend"
requires-python = ">=3.10"
authors = [{ name = "Srishti Dasgupta" }]
dependencies = [
  "simulus>=1.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "PyYAML>=6.0",
  "redis>=5.0",
  "requests>=2.31",
  "paramiko>=3.0",
  "boto3>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
elastiflow = "elastiflow.cli:main"

[tool.setuptools.packages.find]
include = ["elastiflow*"]

[tool.setuptools.package-data]
elastiflow = ["config/*.yaml", "scripts/*.csv", "scripts/*.yaml", "*.yaml"]
