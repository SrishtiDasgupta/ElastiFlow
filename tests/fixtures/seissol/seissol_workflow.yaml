api: 4.7.0

id: test1

constraints:
    budget: 40 # gaussian with avg
    deadline: 14000 # gaussian with avg
    chains: 3 # random
    tinydaIterations: 12 # random

vars:
  - id: input_coh
    value: 3
 
actions:
  - type: for
    input: input_coh
    enumerator: i
    yieldToInput: output_coh   # feed into for-each action's input
    actions:
      - type: execute
        service: ../../elastiflow/scripts/simulate-tinyda-seissol.py
        inputs:
          - id: tinyda_input
            var: i
        outputs:
          - id: tinyda_output
            var: output_coh

config:
  workflowIterations: 3
  workflowConfig:
  - chains: 3
    tinydaIterations: 12
  - chains: 2
    tinydaIterations: 10
  - chains: 4
    tinydaIterations: 15
